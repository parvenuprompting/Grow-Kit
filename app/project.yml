name: GrowKit
options:
  bundleIdPrefix: nl.growkit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: VJ9D2C765N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.4.0
    CURRENT_PROJECT_VERSION: 11
    SWIFT_VERSION: "5.10"
targets:
  GrowKit:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Fonts
        buildPhase: resources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GrowKit
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "10"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Editorial Monochrome — Fraunces & Inter (SIL OFL)"
